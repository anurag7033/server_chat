<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninja Runner | Neon Arcade</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-ui">
        <div class="game-header">
            <button onclick="location.href='../../index.html'" class="nav-btn">🏠 Hub</button>
            <div id="score">0m</div>
            <div id="high-score">Best: 0m</div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="start-screen" class="overlay">
            <h1 class="glow-text">NINJA RUNNER</h1>
            <p>Jump: W / Up / Space</p>
            <p>Slide: S / Down | Attack: J / Click</p>
            <button id="start-btn" class="main-btn">RUN</button>
        </div>

        <div id="game-over" class="overlay hidden">
            <h1 class="glow-text" style="color: #f85149;">DEFEATED</h1>
            <p id="final-dist">Distance: 0m</p>
            <button id="restart-btn" class="main-btn">RETRY</button>
            <button onclick="location.href='../../index.html'" class="main-btn secondary">HUB</button>
        </div>

        <div class="mobile-controls">
            <button id="jump-btn" class="ctrl-btn">↑</button>
            <button id="attack-btn" class="ctrl-btn">⚔️</button>
            <button id="slide-btn" class="ctrl-btn">↓</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
