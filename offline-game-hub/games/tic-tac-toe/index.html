<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe | Neon Arcade</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-ui">
        <div class="game-header">
            <button onclick="location.href='../../index.html'" class="nav-btn">🏠 Hub</button>
            <div class="score-board">
                <div class="score">YOU: <span id="player-score">0</span></div>
                <div class="score">AI: <span id="ai-score">0</span></div>
            </div>
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard" selected>Hard (Minimax)</option>
            </select>
        </div>

        <div id="board" class="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div id="status" class="status">Your Turn (X)</div>

        <div class="action-btns">
            <button id="reset-btn" class="main-btn">RESET MATCH</button>
            <button onclick="location.href='../../index.html'" class="main-btn secondary">HUB</button>
        </div>

        <div id="win-overlay" class="overlay hidden">
            <h1 id="win-message" class="glow-text">WINNER!</h1>
            <button id="next-round-btn" class="main-btn">NEXT ROUND</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
