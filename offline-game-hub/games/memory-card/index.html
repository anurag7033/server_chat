<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memory Card | Neon Arcade</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-ui">
        <div class="game-header">
            <button onclick="location.href='../../index.html'" class="nav-btn">🏠 Hub</button>
            <div class="stats">
                <div class="stat">MOVES: <span id="moves">0</span></div>
                <div class="stat">TIME: <span id="timer">0s</span></div>
            </div>
            <select id="difficulty">
                <option value="easy">4x4</option>
                <option value="medium">5x4</option>
                <option value="hard">6x6</option>
            </select>
        </div>

        <div id="grid" class="memory-grid"></div>

        <div id="win-screen" class="overlay hidden">
            <h1 class="glow-text">MATCHED!</h1>
            <p>Moves: <span id="final-moves">0</span> | Time: <span id="final-time">0</span>s</p>
            <button id="restart-btn" class="main-btn">PLAY AGAIN</button>
            <button onclick="location.href='../../index.html'" class="main-btn secondary">HUB</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
