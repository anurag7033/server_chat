<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Shooter | Neon Arcade</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-ui">
        <div class="game-header">
            <button onclick="location.href='../../index.html'" class="nav-btn">🏠 Home</button>
            <div id="score">Kills: 0</div>
            <div id="health-bar-container"><div id="health-bar"></div></div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="start-screen" class="overlay">
            <h1 class="glow-text">ZOMBIE SHOOTER</h1>
            <p>Move: WASD | Aim: Mouse | Shoot: Click</p>
            <p>Mobile: Left Joystick to Move, Right to Shoot</p>
            <button id="start-btn" class="main-btn">SURVIVE</button>
        </div>

        <div id="game-over" class="overlay hidden">
            <h1 class="glow-text" style="color: #f85149;">OVERRUN!</h1>
            <p id="final-score">Kills: 0</p>
            <button id="restart-btn" class="main-btn">RETRY</button>
            <button onclick="location.href='../../index.html'" class="main-btn secondary">HUB</button>
        </div>

        <!-- Virtual Joysticks for Mobile -->
        <div class="joystick-container">
            <div id="move-joystick" class="joystick"></div>
            <div id="shoot-joystick" class="joystick"></div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
