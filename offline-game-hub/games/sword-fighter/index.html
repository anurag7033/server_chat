<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sword Fighter | Neon Arcade</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-ui">
        <div class="game-header">
            <button onclick="location.href='../../index.html'" class="nav-btn">🏠 Hub</button>
            <div id="stats">
                <span>STAGE: <span id="stage">1</span></span>
                <div class="hp-bar-bg"><div id="hp-bar" class="hp-bar"></div></div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="start-screen" class="overlay">
            <h1 class="glow-text">NEON BLADE</h1>
            <p>Move: WASD / Arrows | Attack: Space / J / Tap</p>
            <p>Defeat the enemy warriors!</p>
            <button id="start-btn" class="main-btn">ENTER ARENA</button>
        </div>

        <div id="game-over" class="overlay hidden">
            <h1 class="glow-text" style="color: #f85149;">FALLEN</h1>
            <p id="final-stats">Stages Cleared: 0</p>
            <button id="restart-btn" class="main-btn">RETRY</button>
            <button onclick="location.href='../../index.html'" class="main-btn secondary">HUB</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
