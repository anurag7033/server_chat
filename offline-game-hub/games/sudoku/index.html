<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sudoku | Neon Arcade</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-ui">
        <div class="game-header">
            <button onclick="location.href='../../index.html'" class="nav-btn">🏠 Hub</button>
            <div id="timer">00:00</div>
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
            </select>
        </div>

        <div class="game-container">
            <div id="sudoku-board" class="sudoku-board"></div>
        </div>

        <div id="sudoku-controls">
            <div id="num-pad" class="num-pad"></div>
            <div class="action-btns">
                <button id="hint-btn" class="main-btn secondary">HINT</button>
                <button id="erase-btn" class="main-btn secondary">ERASE</button>
                <button id="new-game-btn" class="main-btn">NEW GAME</button>
            </div>
        </div>

        <div id="win-screen" class="overlay hidden">
            <h1 class="glow-text">SOLVED!</h1>
            <p>Time: <span id="final-time">00:00</span></p>
            <button id="play-again-btn" class="main-btn">PLAY AGAIN</button>
            <button onclick="location.href='../../index.html'" class="main-btn secondary">HUB</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
