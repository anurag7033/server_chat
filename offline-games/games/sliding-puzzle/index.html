<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sliding Puzzle | Neon Arcade</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-ui">
        <div class="game-header">
            <button onclick="location.href='../../index.html'" class="nav-btn">🏠 Hub</button>
            <div id="stats">
                <span>MOVES: <span id="moves">0</span></span>
                <span>15-PUZZLE</span>
            </div>
        </div>

        <div id="grid" class="puzzle-grid"></div>

        <div class="action-btns">
            <button id="shuffle-btn" class="main-btn">SHUFFLE</button>
            <button onclick="location.href='../../index.html'" class="main-btn secondary">HUB</button>
        </div>

        <div id="win-screen" class="overlay hidden">
            <h1 class="glow-text">COMPLETE!</h1>
            <p id="final-moves">Moves: 0</p>
            <button id="restart-btn" class="main-btn">PLAY AGAIN</button>
            <button onclick="location.href='../../index.html'" class="main-btn secondary">HUB</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
