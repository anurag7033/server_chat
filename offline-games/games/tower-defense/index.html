<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tower Defense | Neon Arcade</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-ui">
        <div class="game-header">
            <button onclick="location.href='../../index.html'" class="nav-btn">🏠 Hub</button>
            <div id="stats">
                <span>💰 <span id="money">100</span></span>
                <span>❤️ <span id="lives">20</span></span>
                <span>WAVE: <span id="wave">1</span></span>
            </div>
            <button id="next-wave-btn" class="main-btn">START WAVE</button>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="shop">
            <button class="shop-item active" data-type="basic" data-cost="50">
                <div class="icon">🗼</div>
                <div class="label">BASIC ($50)</div>
            </button>
            <button class="shop-item" data-type="fast" data-cost="75">
                <div class="icon">⚡</div>
                <div class="label">FAST ($75)</div>
            </button>
            <button class="shop-item" data-type="sniper" data-cost="150">
                <div class="icon">🎯</div>
                <div class="label">SNIPER ($150)</div>
            </button>
        </div>

        <div id="start-screen" class="overlay">
            <h1 class="glow-text">TOWER DEFENSE</h1>
            <p>Don't let the enemies reach the end of the path!</p>
            <p>Click on the grid to place towers.</p>
            <button id="start-btn" class="main-btn">BEGIN DEFENSE</button>
        </div>

        <div id="game-over" class="overlay hidden">
            <h1 class="glow-text" style="color: #f85149;">BASE OVERRUN!</h1>
            <p id="final-stats">Waves Survived: 1</p>
            <button id="restart-btn" class="main-btn">RETRY</button>
            <button onclick="location.href='../../index.html'" class="main-btn secondary">HUB</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
