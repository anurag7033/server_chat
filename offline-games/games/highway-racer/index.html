<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Highway Racer | Neon Arcade</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-ui">
        <div class="game-header">
            <button onclick="location.href='../../index.html'" class="nav-btn">🏠 Hub</button>
            <div class="stats">
                <div id="score">0m</div>
                <div id="speed-meter">0 km/h</div>
            </div>
            <div id="high-score">Best: 0m</div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="start-screen" class="overlay">
            <h1 class="glow-text">HIGHWAY RACER</h1>
            <p>Overtake traffic for bonus points!</p>
            <p>Controls: Arrows / WASD</p>
            <button id="start-btn" class="main-btn">GO FAST</button>
        </div>

        <div id="game-over" class="overlay hidden">
            <h1 class="glow-text" style="color: #f85149;">WRECKED!</h1>
            <p id="final-dist">Distance: 0m</p>
            <p id="near-misses">Near Misses: 0</p>
            <button id="restart-btn" class="main-btn">RETRY</button>
            <button onclick="location.href='../../index.html'" class="main-btn secondary">HUB</button>
        </div>

        <div class="mobile-controls">
            <button id="left-btn" class="ctrl-btn">◀</button>
            <button id="right-btn" class="ctrl-btn">▶</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
