<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shooting Gallery | Neon Arcade</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-ui">
        <div class="game-header">
            <button onclick="location.href='../../index.html'" class="nav-btn">🏠 Hub</button>
            <div id="stats">
                <span>Score: <span id="score">0</span></span>
                <span>Time: <span id="timer">30</span>s</span>
            </div>
            <div id="combo">COMBO: x1</div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="start-screen" class="overlay">
            <h1 class="glow-text">SHOOTING GALLERY</h1>
            <p>Tap or Click the targets as fast as you can!</p>
            <p>Smaller targets = More points</p>
            <button id="start-btn" class="main-btn">START SHOOTING</button>
        </div>

        <div id="game-over" class="overlay hidden">
            <h1 class="glow-text">TIME'S UP!</h1>
            <p id="final-score">Score: 0</p>
            <p id="accuracy">Accuracy: 0%</p>
            <button id="restart-btn" class="main-btn">RETRY</button>
            <button onclick="location.href='../../index.html'" class="main-btn secondary">HUB</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
