<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - Game Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="glow">TIC-TAC-TOE</h1>

        <div class="modes">
            <button id="pve-btn" class="active">Player vs CPU</button>
            <button id="pvp-btn">Player vs Player</button>
            <a href="../../index.html" class="home-btn">HOME</a>
        </div>

        <div id="status">Your Turn (X)</div>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <button id="reset">RESET MATCH</button>
        <div id="stats">Wins: <span id="win-count">0</span></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
