<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Archery | Neon Arcade</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-ui">
        <div class="game-header">
            <button onclick="location.href='../../index.html'" class="nav-btn">🏠 Hub</button>
            <div id="stats">
                <span>🎯 SCORE: <span id="score">0</span></span>
                <span>🏹 ARROWS: <span id="arrows">10</span></span>
            </div>
            <div id="wind">WIND: 0.0</div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="start-screen" class="overlay">
            <h1 class="glow-text">ARCHERY</h1>
            <p>Aim for the center of the target!</p>
            <p>Click and Drag BACK to aim and power.</p>
            <p>Watch the wind direction!</p>
            <button id="start-btn" class="main-btn">START SESSION</button>
        </div>

        <div id="game-over" class="overlay hidden">
            <h1 class="glow-text">SESSION END</h1>
            <p id="final-score">Final Score: 0</p>
            <button id="restart-btn" class="main-btn">RETRY</button>
            <button onclick="location.href='../../index.html'" class="main-btn secondary">HUB</button>
        </div>

        <div id="feedback" class="feedback hidden">BULLSEYE! +100</div>
    </div>
    <script src="game.js"></script>
</body>
</html>
