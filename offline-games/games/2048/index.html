<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 | Neon Arcade</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-ui">
        <div class="game-header">
            <button onclick="location.href='../../index.html'" class="nav-btn">🏠 Hub</button>
            <div class="scores">
                <div class="score-box">SCORE<br><span id="score">0</span></div>
                <div class="score-box">BEST<br><span id="best-score">0</span></div>
            </div>
        </div>

        <div class="game-container">
            <div id="grid-container" class="grid-container">
                <!-- Grid will be generated by JS -->
            </div>
        </div>

        <div id="game-over" class="overlay hidden">
            <h1 class="glow-text" style="color: #f85149;">GAME OVER</h1>
            <p>Score: <span id="final-score">0</span></p>
            <button id="restart-btn" class="main-btn">TRY AGAIN</button>
            <button onclick="location.href='../../index.html'" class="main-btn secondary">HUB</button>
        </div>

        <div id="win-screen" class="overlay hidden">
            <h1 class="glow-text">2048!</h1>
            <p>You reached the legendary tile!</p>
            <button id="continue-btn" class="main-btn">CONTINUE</button>
            <button onclick="location.href='../../index.html'" class="main-btn secondary">HUB</button>
        </div>

        <div class="instructions">
            <p>Use <b>Arrow Keys</b> or <b>Swipe</b> to merge tiles!</p>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
