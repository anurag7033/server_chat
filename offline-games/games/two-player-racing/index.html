<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2-Player Racing | Neon Arcade</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-ui">
        <div class="game-header">
            <button onclick="location.href='../../index.html'" class="nav-btn">🏠 Hub</button>
            <div id="laps">LAP: 1 / 3</div>
            <div id="timer">0.0s</div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="start-screen" class="overlay">
            <h1 class="glow-text">DUAL DRIFT</h1>
            <div class="controls-guide">
                <div class="p-guide">
                    <h3 style="color: #00f2ff;">P1 (CYAN)</h3>
                    <p>WASD to Drive</p>
                </div>
                <div class="p-guide">
                    <h3 style="color: #f85149;">P2 (RED)</h3>
                    <p>Arrows to Drive</p>
                </div>
            </div>
            <p>Race for 3 Laps! Complete the circuit to win.</p>
            <button id="start-btn" class="main-btn">START RACE</button>
        </div>

        <div id="game-over" class="overlay hidden">
            <h1 id="win-message" class="glow-text">PLAYER 1 WINS!</h1>
            <p id="finish-time">Time: 0.0s</p>
            <button id="restart-btn" class="main-btn">REMATCH</button>
            <button onclick="location.href='../../index.html'" class="main-btn secondary">HUB</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
