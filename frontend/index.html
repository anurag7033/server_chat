<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone-PC Local Chat</title>
<style>
:root {
  --bg: #0f1117;
  --card: #181c24;
  --border: #303746;
  --text: #f4f7fb;
  --muted: #9aa4b2;
  --blue: #2864e8;
  --green: #18a957;
  --danger: #ef4444;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}
.container {
  width: min(920px, 94%);
  margin: 30px auto;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 15px 45px rgba(0,0,0,.25);
}
.header {
  padding: 20px 22px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}
.title { font-size: 24px; font-weight: 700; }
.status { color: var(--muted); font-size: 14px; margin-top: 5px; }
.status.online { color: #36d477; }
.status.offline { color: #ff5b63; }
.body { padding: 22px; }
button {
  border: 0;
  border-radius: 10px;
  padding: 13px 18px;
  color: white;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
.primary { background: var(--blue); }
.green { background: var(--green); }
.danger { background: var(--danger); }
button:disabled { opacity: .55; cursor: not-allowed; }
.room-card {
  text-align: center;
  padding: 35px 20px;
}
.room-card h2 { margin: 8px 0; }
.room-card p { color: var(--muted); line-height: 1.6; }
.room-btn { margin-top: 15px; min-width: 220px; }
.join-form {
  max-width: 430px;
  margin: 25px auto 0;
  display: none;
}
input {
  width: 100%;
  background: #0d1016;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  color: var(--text);
  outline: none;
  margin: 8px 0 12px;
}
input:focus { border-color: var(--blue); }
.chat {
  display: none;
  height: 650px;
  flex-direction: column;
}
.chat-top {
  padding: 15px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.users { color: #36d477; font-size: 14px; }
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
}
.message {
  max-width: 78%;
  margin: 8px 0;
  padding: 10px 13px;
  border-radius: 13px;
  background: #252b37;
}
.message.mine {
  margin-left: auto;
  background: #2455c7;
}
.name { font-size: 12px; font-weight: 700; color: #c8d0dc; margin-bottom: 5px; }
.message.mine .name { color: #dce7ff; }
.text { white-space: pre-wrap; word-break: break-word; }
.time { font-size: 10px; opacity: .7; margin-top: 5px; text-align: right; }
.system {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  margin: 10px;
}
.composer {
  border-top: 1px solid var(--border);
  padding: 12px;
  display: flex;
  gap: 10px;
}
.composer input { margin: 0; flex: 1; }
.send { width: 60px; }
.typing {
  height: 18px;
  padding: 0 18px;
  color: var(--muted);
  font-size: 12px;
}
.device {
  color: var(--muted);
  font-size: 12px;
}
@media (max-width: 600px) {
  .container { margin: 10px auto; width: 97%; }
  .chat { height: calc(100vh - 90px); }
  .message { max-width: 88%; }
}
</style>
</head>
<body>
<div class="container">
  <div class="card">

    <div class="header">
      <div>
        <div class="title">💬 Local Chat Room</div>
        <div id="status" class="status offline">🔴 Server disconnected</div>
      </div>
      <div id="deviceInfo" class="device"></div>
    </div>

    <div id="home" class="body">
      <div class="room-card">
        <div style="font-size:50px">🏠</div>
        <h2>Local Network Room</h2>
        <p>
          Chat in real time with people connected to the same
          Wi-Fi / local network.
        </p>
        <button id="joinBtn" class="primary room-btn">💬 Join Local Room</button>

        <div id="joinForm" class="join-form">
          <label>Your Name</label>
          <input id="nameInput" maxlength="32" placeholder="Enter your name">
          <button id="connectBtn" class="green" style="width:100%">Join Room</button>
        </div>
      </div>
    </div>

    <div id="chat" class="chat">
      <div class="chat-top">
        <div>
          <strong>💬 Local Room</strong>
          <div id="onlineCount" class="users">🟢 0 online</div>
        </div>
        <button id="leaveBtn" class="danger">Leave</button>
      </div>

      <div id="messages" class="messages"></div>
      <div id="typing" class="typing"></div>

      <div class="composer">
        <input id="messageInput" maxlength="4000" placeholder="Type a message..." autocomplete="off">
        <button id="sendBtn" class="primary send">➤</button>
      </div>
    </div>

  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  const statusEl = $("status");
  const deviceInfo = $("deviceInfo");
  const home = $("home");
  const chat = $("chat");
  const joinBtn = $("joinBtn");
  const joinForm = $("joinForm");
  const nameInput = $("nameInput");
  const connectBtn = $("connectBtn");
  const leaveBtn = $("leaveBtn");
  const messagesEl = $("messages");
  const messageInput = $("messageInput");
  const sendBtn = $("sendBtn");
  const onlineCount = $("onlineCount");
  const typingEl = $("typing");

  let socket = null;
  let deviceId = localStorage.getItem("phonePcDeviceId");
  let deviceName = localStorage.getItem("phonePcDeviceName") || "";
  let typingTimer = null;
  let intentionallyClosed = false;

  if (!deviceId) {
    deviceId = "DEV-" + cryptoRandom();
    localStorage.setItem("phonePcDeviceId", deviceId);
  }

  if (deviceName) nameInput.value = deviceName;

  function cryptoRandom() {
    if (window.crypto && crypto.getRandomValues) {
      const arr = new Uint32Array(1);
      crypto.getRandomValues(arr);
      return arr[0].toString(16).slice(-4).toUpperCase();
    }
    return Math.random().toString(16).slice(2, 6).toUpperCase();
  }

  function setStatus(text, online) {
    statusEl.textContent = (online ? "🟢 " : "🔴 ") + text;
    statusEl.className = "status " + (online ? "online" : "offline");
  }

  function wsUrl() {
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    // Frontend is served from the same PC's port 8000 in the recommended setup.
    // If served on another port, keep the WebSocket on port 8000.
    const host = location.hostname + ":8000";
    return protocol + "//" + host + "/ws";
  }

  function formatTime(timestamp) {
    try {
      return new Date(timestamp).toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });
    } catch {
      return "";
    }
  }

  function clearMessages() {
    messagesEl.innerHTML = "";
  }

  function addSystem(text, timestamp) {
    const div = document.createElement("div");
    div.className = "system";
    div.textContent = text + (timestamp ? " • " + formatTime(timestamp) : "");
    messagesEl.appendChild(div);
    scrollBottom();
  }

  function addMessage(msg) {
    const div = document.createElement("div");
    div.className = "message" + (msg.device_id === deviceId ? " mine" : "");

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = msg.device_name || "Guest";

    const text = document.createElement("div");
    text.className = "text";
    text.textContent = msg.message || "";

    const time = document.createElement("div");
    time.className = "time";
    time.textContent = formatTime(msg.timestamp);

    div.appendChild(name);
    div.appendChild(text);
    div.appendChild(time);
    messagesEl.appendChild(div);
    scrollBottom();
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function updateUsers(users) {
    onlineCount.textContent = "🟢 " + (users?.length || 0) + " online";
  }

  function connect() {
    const name = nameInput.value.trim();

    if (!name) {
      alert("Please enter your name.");
      nameInput.focus();
      return;
    }

    deviceName = name.slice(0, 32);
    localStorage.setItem("phonePcDeviceName", deviceName);

    intentionallyClosed = false;
    connectBtn.disabled = true;
    setStatus("Connecting...", false);

    try {
      socket = new WebSocket(wsUrl());
    } catch (error) {
      connectBtn.disabled = false;
      setStatus("Connection failed", false);
      alert("WebSocket could not be created.");
      return;
    }

    socket.onopen = () => {
      // REQUIRED by the FastAPI backend.
      socket.send(JSON.stringify({
        type: "register",
        device_id: deviceId,
        device_name: deviceName
      }));
    };

    socket.onmessage = (event) => {
      let data;
      try {
        data = JSON.parse(event.data);
      } catch {
        return;
      }

      switch (data.type) {
        case "registered":
          setStatus("Local Room connected", true);
          deviceInfo.textContent = deviceName + " • " + data.device_id;
          home.style.display = "none";
          chat.style.display = "flex";
          clearMessages();
          updateUsers(data.users || []);

          (data.messages || []).forEach(addMessage);
          messageInput.focus();
          break;

        case "chat_message":
          addMessage(data);
          break;

        case "presence":
          updateUsers(data.users || []);
          break;

        case "system":
          addSystem(data.message, data.timestamp);
          break;

        case "typing":
          if (data.is_typing) {
            typingEl.textContent = "✍️ " + data.device_name + " is typing...";
          } else {
            typingEl.textContent = "";
          }
          break;

        case "error":
          console.error("Server:", data.message);
          break;
      }
    };

    socket.onerror = () => {
      setStatus("WebSocket error", false);
    };

    socket.onclose = () => {
      socket = null;
      connectBtn.disabled = false;
      setStatus("Server disconnected", false);
      typingEl.textContent = "";

      if (!intentionallyClosed) {
        addSystem("Disconnected from Local Room");
      }
    };
  }

  function sendMessage() {
    const text = messageInput.value.trim();

    if (!text || !socket || socket.readyState !== WebSocket.OPEN) {
      return;
    }

    socket.send(JSON.stringify({
      type: "chat_message",
      message: text
    }));

    messageInput.value = "";
    sendTyping(false);
    messageInput.focus();
  }

  function sendTyping(isTyping) {
    if (!socket || socket.readyState !== WebSocket.OPEN) return;

    socket.send(JSON.stringify({
      type: "typing",
      is_typing: isTyping
    }));
  }

  joinBtn.addEventListener("click", () => {
    joinForm.style.display = "block";
    joinBtn.style.display = "none";
    nameInput.focus();
  });

  connectBtn.addEventListener("click", connect);

  nameInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") connect();
  });

  sendBtn.addEventListener("click", sendMessage);

  messageInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  messageInput.addEventListener("input", () => {
    sendTyping(true);
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => sendTyping(false), 900);
  });

  leaveBtn.addEventListener("click", () => {
    intentionallyClosed = true;
    if (socket) socket.close();

    chat.style.display = "none";
    home.style.display = "block";
    joinForm.style.display = "block";
    joinBtn.style.display = "none";
    connectBtn.disabled = false;
    setStatus("Server disconnected", false);
    deviceInfo.textContent = "";
    messagesEl.innerHTML = "";
  });

  setStatus("Server ready — join the room", false);
})();
</script>
</body>
</html>
